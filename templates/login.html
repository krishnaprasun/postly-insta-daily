{% extends "base.html" %}
{% block title %}Sign in — Postly Daily{% endblock %}
{% block shell %}login{% endblock %}
{% block body %}
<div class="card">
  <img src="{{ url_for('brand_logo') }}" alt="Postly">
  <div class="sub" style="margin-bottom:20px">Daily Instagram posts</div>
  {% if error %}<div class="banner b-bad" style="text-align:left">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="fld"><label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus></div>
    <div class="fld"><label>Password</label>
      <input type="password" name="password" autocomplete="current-password"></div>
    <button class="btn pri" style="width:100%;margin-top:6px">Sign in</button>
  </form>
</div>
<div class="sub" style="text-align:center">The daily review link opens without signing in.</div>
{% endblock %}
