<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Postly Daily{% endblock %}</title>
<style>
  :root{
    --bg:#0f1014; --card:#191b22; --card2:#212430; --line:#2c303c;
    --ink:#f2f3f7; --mut:#9aa0b0; --acc:#ff6b35; --ok:#2fbf71; --warn:#f5b544; --bad:#ef4a5a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  a{color:var(--acc);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .sub{color:var(--mut);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
  .banner{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;border:1px solid}
  .b-warn{background:rgba(245,181,68,.10);border-color:rgba(245,181,68,.45);color:#ffd894}
  .b-bad{background:rgba(239,74,90,.10);border-color:rgba(239,74,90,.45);color:#ffb3bb}
  .b-ok{background:rgba(47,191,113,.10);border-color:rgba(47,191,113,.45);color:#a5e9c4}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .v{background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden;
     display:flex;flex-direction:column}
  .v.approved{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .v.rejected{opacity:.45}
  .v img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;background:#000}
  .v .meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;
           font-size:12px;color:var(--mut);gap:8px}
  .v .acts{padding:0 12px 12px;display:flex;gap:8px}
  .btn{appearance:none;border:1px solid var(--line);background:#2a2e3b;color:var(--ink);
       border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:#414759}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0e08}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#04240f}
  .btn.gh{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
       border:1px solid var(--line);color:var(--mut)}
  .tag.ok{color:#a5e9c4;border-color:rgba(47,191,113,.5)}
  .tag.warn{color:#ffd894;border-color:rgba(245,181,68,.5)}
  .cap{white-space:pre-wrap;background:#12141a;border:1px solid var(--line);border-radius:10px;
       padding:12px;font-size:13.5px;max-height:260px;overflow:auto}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
  .kv div:nth-child(odd){color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  input[type=text],input[type=date],textarea{background:#12141a;border:1px solid var(--line);
       color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}
  h2{font-size:15px;margin:0 0 10px}
  .muted{color:var(--mut)}
  @media (max-width:640px){ .grid{grid-template-columns:1fr 1fr;gap:10px}
    .v .acts{flex-direction:column} .kv{grid-template-columns:100px 1fr} }
</style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div></body>
</html>
