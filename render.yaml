services:
  - type: web
    name: postly-insta-daily
    runtime: docker
    # starter (not free): a free instance sleeps after inactivity, which kills the
    # 07:00 IST scheduler, and free instances cannot mount a disk.
    plan: starter
    healthCheckPath: /healthz
    # No disk on purpose: images and run history are ephemeral. The day's post is
    # reviewed and downloaded the same morning. A restart loses that day's images
    # and the review link with them — regenerate from the admin page if that happens.
    envVars:
      # Generation
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: LITELLM_MODEL
        sync: false
      - key: LITELLM_TEXT_MODEL
        value: gemini-2.5-flash-lite
      # Review UI
      - key: PUBLIC_BASE_URL
        sync: false          # https://<service>.onrender.com — used in the review link
      - key: ADMIN_USER
        value: postly
      - key: ADMIN_PASS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Daily run
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RUN_HOUR_IST
        value: "7"
      - key: VARIANT_COUNT
        value: "5"
      # Meta fetches the JPEG from this service; the Postly CDN re-encodes to WEBP
      - key: IG_IMAGE_SOURCE
        value: self
      # Notification (optional)
      - key: NOTIFY_CHANNEL
        value: none
      - key: NOTIFY_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Public image hosting (needed before Instagram publishing can work)
      - key: POSTLY_CDN_URL
        sync: false
      - key: POSTLY_CDN_ACCESS_TOKEN
        sync: false
      # Instagram — leave off until the account has API access
      - key: IG_PUBLISH_ENABLED
        value: "false"
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
